; DTX-AI hardware demo node — ESP32-WROOM-32 + DS18B20 + BMP280.
;
; Build & flash:
;   cd HW
;   pio run -t upload          # auto-detects the serial port
;   pio device monitor         # 115200 baud
;
; WiFi credentials: copy include/wifi_config.example.h to
; include/wifi_config.h and fill in your SSID/password (the real file is
; gitignored so credentials never land in the repo).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.4
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit Unified Sensor@^1.1.15
    bblanchon/ArduinoJson@^7.4.2
